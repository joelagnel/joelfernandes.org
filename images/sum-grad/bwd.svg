<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#ffffff"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Backward pass: one gradient arrives, two identical copies leave</text>

  <!-- backward edges, right to left -->
  <g stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowB)" stroke-dasharray="7,4">
    <line x1="606.3" y1="210.2" x2="496.3" y2="141.4"/>
    <line x1="606.3" y1="239.8" x2="496.3" y2="308.6"/>
    <line x1="442" y1="125" x2="319" y2="125"/>
    <line x1="442" y1="325" x2="319" y2="325"/>
    <line x1="261.6" y1="119.5" x2="120.4" y2="91.1"/>
    <line x1="261.6" y1="130.5" x2="120.4" y2="158.9"/>
    <line x1="261.6" y1="319.5" x2="120.4" y2="291.1"/>
    <line x1="261.6" y1="330.5" x2="120.4" y2="358.9"/>
  </g>

  <!-- nodes -->
  <g stroke="#c0392b" stroke-width="3" fill="#fdecea">
    <circle cx="90" cy="85" r="28"/>
    <circle cx="90" cy="165" r="28"/>
    <circle cx="90" cy="285" r="28"/>
    <circle cx="90" cy="365" r="28"/>
  </g>
  <g stroke="#2c5f8a" stroke-width="2" fill="#ffffff">
    <circle cx="289" cy="125" r="25"/>
    <circle cx="289" cy="325" r="25"/>
  </g>
  <g stroke="#2c5f8a" stroke-width="2" fill="#dff0e4">
    <circle cx="470" cy="125" r="28"/>
    <circle cx="470" cy="325" r="28"/>
  </g>
  <circle cx="630" cy="225" r="28" stroke="#555" stroke-width="2" fill="#f2f2f2"/>

  <g font-size="15" text-anchor="middle" fill="#1a1a1a">
    <text x="90" y="90">A11</text>
    <text x="90" y="170">A12</text>
    <text x="90" y="290">A21</text>
    <text x="90" y="370">A22</text>
    <text x="470" y="130">B1</text>
    <text x="470" y="330">B2</text>
    <text x="630" y="231" font-style="italic">L</text>
  </g>
  <g font-size="24" text-anchor="middle" fill="#1a1a1a">
    <text x="289" y="134">+</text>
    <text x="289" y="334">+</text>
  </g>

  <!-- gradient labels -->
  <g font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">
    <text x="556" y="160">G1</text>
    <text x="556" y="300">G2</text>
    <text x="380" y="114">G1</text>
    <text x="380" y="314">G2</text>
    <text x="191" y="94">G1</text>
    <text x="191" y="167">G1</text>
    <text x="191" y="294">G2</text>
    <text x="191" y="367">G2</text>
  </g>

  <g font-size="12" fill="#888">
    <text x="191" y="200" text-anchor="middle">same value, copied</text>
    <text x="191" y="400" text-anchor="middle">same value, copied</text>
  </g>

  <text x="360" y="440" text-anchor="middle" font-size="12" fill="#888">The plus node does not scale anything, so both outgoing arrows carry the gradient unchanged.</text>
</svg>
