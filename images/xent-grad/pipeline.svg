<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The cross-entropy block, and the gradient we want back out</text>

  <g stroke="#2c5f8a" stroke-width="2">
    <rect x="90" y="72" width="170" height="46" rx="6" fill="#eaf2f8"/>
    <rect x="90" y="156" width="170" height="46" rx="6" fill="#eaf2f8"/>
    <rect x="340" y="98" width="140" height="86" rx="6" fill="#ffffff"/>
    <rect x="570" y="114" width="150" height="54" rx="6" fill="#dff0e4"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#1a1a1a">
    <text x="175" y="94">logits</text>
    <text x="175" y="178">Yb</text>
    <text x="410" y="134">cross</text>
    <text x="410" y="158">entropy</text>
    <text x="645" y="138">loss L</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="175" y="111">32 × 27</text>
    <text x="175" y="195">32 correct characters</text>
    <text x="645" y="156">one number</text>
  </g>
  <g stroke="#2c5f8a" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="260" y1="95" x2="334" y2="122"/>
    <line x1="260" y1="179" x2="334" y2="160"/>
    <line x1="480" y1="141" x2="564" y2="141"/>
  </g>

  <line x1="410" y1="184" x2="410" y2="212" stroke="#888" stroke-width="2" marker-end="url(#arGrey)" fill="none"/>
  <text x="410" y="232" text-anchor="middle" font-size="13" fill="#666">L says how likely you were to predict Yb</text>

  <g stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arRed)" stroke-dasharray="6 4">
    <path d="M 645 172 L 645 288 Q 645 300, 631 300 L 54 300 Q 40 300, 40 286 L 40 109 Q 40 95, 54 95 L 84 95"/>
  </g>
  <text x="420" y="330" text-anchor="middle" font-size="15" fill="#c0392b">what we want: dL / dlogits, also 32 × 27</text>
</svg>
