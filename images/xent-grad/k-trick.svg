  <text x="370.0" y="64" text-anchor="middle" font-size="15" fill="#c0392b">e<tspan font-size="0.72em" dy="-0.42em">a</tspan></text>
  <text x="370.0" y="146" text-anchor="middle" font-size="12" fill="#c0392b">the one we differentiate</text>

  <path d="M 73.0 168 v 10 h 276.0 v -10" fill="none" stroke="#888" stroke-width="1.6"/>
  <path d="M 391.0 178 v -10 h 276.0 v 10" fill="none" stroke="#888" stroke-width="1.6"/>
  <text x="370" y="222" text-anchor="middle" font-size="14" fill="#1a1a1a">the other 26 exponentials never change when <tspan font-style="italic">a</tspan> changes</text>
  <text x="370" y="244" text-anchor="middle" font-size="15" fill="#1a1a1a">call the whole pile <tspan font-style="italic">k</tspan></text>

  <rect x="220" y="254" width="300" height="66" rx="8" fill="#eaf2f8" stroke="#2c5f8a" stroke-width="2"/>
  <text x="327" y="294" text-anchor="middle" font-size="20" fill="#1a1a1a">SM  =</text>
  <text x="370" y="350" text-anchor="middle" font-size="14" fill="#666">one variable, one constant, and now it is ordinary single variable calculus</text>
  <text x="395" y="279.0" text-anchor="middle" font-size="19" fill="#1a1a1a">e<tspan font-size="0.72em" dy="-0.42em"><tspan font-style="italic">a</tspan></tspan><tspan dy="0.42em"></tspan></text>
