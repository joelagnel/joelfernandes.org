<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowF" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#ffffff"/>

  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Forward pass: B1 fans out to two subtractions</text>

  <!-- edges -->
  <g stroke="#2c5f8a" stroke-width="2" fill="none" marker-end="url(#arrowF)">
    <line x1="118" y1="60"    x2="264" y2="60"/>
    <line x1="118" y1="340"   x2="264" y2="340"/>
    <line x1="112.9" y1="183.9" x2="268.3" y2="75.2"/>
    <line x1="112.9" y1="216.1" x2="268.3" y2="324.8"/>
    <line x1="314" y1="60"    x2="440" y2="60"/>
    <line x1="314" y1="340"   x2="440" y2="340"/>
    <line x1="491.1" y1="78.4"  x2="606.9" y2="180.2"/>
    <line x1="491.1" y1="321.6" x2="606.9" y2="219.8"/>
  </g>

  <!-- nodes -->
  <g stroke="#2c5f8a" stroke-width="2" fill="#eaf2f8">
    <circle cx="90" cy="60" r="28"/>
    <circle cx="90" cy="340" r="28"/>
    <circle cx="90" cy="200" r="28"/>
    <circle cx="470" cy="60" r="28"/>
    <circle cx="470" cy="340" r="28"/>
  </g>
  <g stroke="#2c5f8a" stroke-width="2" fill="#ffffff">
    <circle cx="289" cy="60" r="25"/>
    <circle cx="289" cy="340" r="25"/>
  </g>
  <circle cx="630" cy="200" r="28" stroke="#555" stroke-width="2" fill="#f2f2f2"/>

  <g font-size="15" text-anchor="middle" fill="#1a1a1a">
    <text x="90" y="65">A11</text>
    <text x="90" y="345">A12</text>
    <text x="90" y="205" font-weight="bold">B1</text>
    <text x="470" y="65">C11</text>
    <text x="470" y="345">C12</text>
    <text x="630" y="206" font-style="italic">L</text>
  </g>
  <g font-size="22" text-anchor="middle" fill="#1a1a1a">
    <text x="289" y="68">&#8722;</text>
    <text x="289" y="348">&#8722;</text>
  </g>

  <g font-size="13" fill="#666">
    <text x="377" y="42" text-anchor="middle">C11 = A11 &#8722; B1</text>
    <text x="377" y="372" text-anchor="middle">C12 = A12 &#8722; B1</text>
    <text x="166" y="101" text-anchor="middle" fill="#c0392b">same B1</text>
    <text x="166" y="303" text-anchor="middle" fill="#c0392b">same B1</text>
  </g>
  <text x="360" y="390" text-anchor="middle" font-size="12" fill="#888">The third copy (C13 = A13 &#8722; B1) is left out to keep the picture small.</text>
</svg>
