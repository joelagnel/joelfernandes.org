<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#ffffff"/>

  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Backward pass: the fan-out becomes a sum</text>

  <!-- backward edges, right to left -->
  <g stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowB)" stroke-dasharray="7,4">
    <line x1="606.9" y1="180.2" x2="493.1" y2="79.9"/>
    <line x1="606.9" y1="219.8" x2="493.1" y2="320.1"/>
    <line x1="440" y1="60"  x2="316" y2="60"/>
    <line x1="440" y1="340" x2="316" y2="340"/>
    <line x1="262" y1="60"  x2="120" y2="60"/>
    <line x1="262" y1="340" x2="120" y2="340"/>
    <line x1="268.5" y1="74.3"  x2="115" y2="182.5"/>
    <line x1="268.5" y1="325.7" x2="115" y2="217.5"/>
  </g>

  <!-- nodes -->
  <g stroke="#2c5f8a" stroke-width="2" fill="#eaf2f8">
    <circle cx="90" cy="60" r="28"/>
    <circle cx="90" cy="340" r="28"/>
    <circle cx="470" cy="60" r="28"/>
    <circle cx="470" cy="340" r="28"/>
  </g>
  <circle cx="90" cy="200" r="28" stroke="#c0392b" stroke-width="3" fill="#fdecea"/>
  <g stroke="#2c5f8a" stroke-width="2" fill="#ffffff">
    <circle cx="289" cy="60" r="25"/>
    <circle cx="289" cy="340" r="25"/>
  </g>
  <circle cx="630" cy="200" r="28" stroke="#555" stroke-width="2" fill="#f2f2f2"/>

  <g font-size="15" text-anchor="middle" fill="#1a1a1a">
    <text x="90" y="65">A11</text>
    <text x="90" y="345">A12</text>
    <text x="90" y="205" font-weight="bold">B1</text>
    <text x="470" y="65">C11</text>
    <text x="470" y="345">C12</text>
    <text x="630" y="206" font-style="italic">L</text>
  </g>
  <g font-size="22" text-anchor="middle" fill="#1a1a1a">
    <text x="289" y="68">&#8722;</text>
    <text x="289" y="348">&#8722;</text>
  </g>

  <!-- gradient labels -->
  <g font-size="13" fill="#c0392b" font-weight="bold">
    <text x="556" y="112" text-anchor="middle">G11</text>
    <text x="556" y="298" text-anchor="middle">G12</text>
    <text x="378" y="50" text-anchor="middle">G11</text>
    <text x="378" y="332" text-anchor="middle">G12</text>
    <text x="191" y="50" text-anchor="middle">+ G11</text>
    <text x="191" y="332" text-anchor="middle">+ G12</text>
    <text x="186" y="104" text-anchor="middle">&#8722; G11</text>
    <text x="186" y="296" text-anchor="middle">&#8722; G12</text>
  </g>

  <!-- sum callout at B1 -->
  <path d="M 118 200 L 236 200" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <rect x="236" y="178" width="256" height="44" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="364" y="196" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">two arrows arrive at B1, so they add up</text>
  <text x="364" y="214" text-anchor="middle" font-size="13" fill="#1a1a1a">dL/dB1 = &#8722;G11 &#8722; G12 ( &#8722; G13 )</text>

  <g font-size="12" fill="#888">
    <text x="360" y="400" text-anchor="middle">G_ij is shorthand for dL/dC_ij, the gradient handed to us from above.</text>
    <text x="360" y="418" text-anchor="middle">A11 and A12 each receive one arrow, so nothing is summed on that side.</text>
  </g>
</svg>
