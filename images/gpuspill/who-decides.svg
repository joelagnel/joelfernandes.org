<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Where the allocation decision is actually made</text>
  <text x="240.0" y="54" text-anchor="middle" font-size="13.5" fill="#2c5f8a" font-weight="bold" >Windows (WDDM)</text>
  <rect x="50" y="72" width="380" height="34" rx="4" fill="#f7f9fb" stroke="#888" stroke-width="1.2"/>
  <text x="240.0" y="93.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >application: cudaMalloc / vkAllocateMemory</text>
  <rect x="50" y="114" width="380" height="30" rx="4" fill="#f7f9fb" stroke="#888" stroke-width="1.2"/>
  <text x="240.0" y="133.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >NVIDIA user-mode driver</text>
  <rect x="50" y="152" width="380" height="38" rx="4" fill="#fdf3e8" stroke="#b8681c" stroke-width="1.6"/>
  <text x="240.0" y="175.0" text-anchor="middle" font-size="10.8" fill="#b8681c" font-weight="bold" >VidMm (Microsoft video memory manager)</text>
  <rect x="50" y="198" width="380" height="30" rx="4" fill="#f7f9fb" stroke="#888" stroke-width="1.2"/>
  <text x="240.0" y="217.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >NVIDIA kernel driver</text>
  <rect x="50" y="236" width="380" height="30" rx="4" fill="#eef4fa" stroke="#888" stroke-width="1.2"/>
  <text x="240.0" y="255.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >VRAM</text>
  <text x="240.0" y="292" text-anchor="middle" font-size="11" fill="#b8681c" font-weight="bold" >VidMm may back an allocation with system pages</text>
  <text x="240.0" y="310" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" >and page it in over PCIe when a kernel runs</text>
  <text x="690.0" y="54" text-anchor="middle" font-size="13.5" fill="#2e7d52" font-weight="bold" >Linux</text>
  <rect x="500" y="72" width="380" height="34" rx="4" fill="#f7f9fb" stroke="#888" stroke-width="1.2"/>
  <text x="690.0" y="93.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >application: cudaMalloc / vkAllocateMemory</text>
  <rect x="500" y="114" width="380" height="30" rx="4" fill="#f7f9fb" stroke="#888" stroke-width="1.2"/>
  <text x="690.0" y="133.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >NVIDIA user-mode driver</text>
  <rect x="500" y="152" width="380" height="30" rx="4" fill="#f7f9fb" stroke="#888" stroke-width="1.2"/>
  <text x="690.0" y="171.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >NVIDIA kernel driver</text>
  <rect x="500" y="190" width="380" height="30" rx="4" fill="#eef4fa" stroke="#888" stroke-width="1.2"/>
  <text x="690.0" y="209.0" text-anchor="middle" font-size="10.8" fill="#555" font-weight="normal" >VRAM</text>
  <text x="690.0" y="246" text-anchor="middle" font-size="11" fill="#2e7d52" font-weight="bold" >no equivalent layer: the request reaches the</text>
  <text x="690.0" y="264" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" >driver, and past free VRAM it simply fails</text>
  <text x="440.0" y="384" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" >The spillover people attribute to the NVIDIA driver on Windows is performed by a Microsoft component.</text>
</svg>
