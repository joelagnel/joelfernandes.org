<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#ffffff"/>
  <text x="440.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">A 25.04 GiB model on a 24564 MiB card: six outcomes</text>
  <rect x="40" y="62" width="800" height="54" rx="4" fill="#fdfdfd" stroke="#ddd" stroke-width="1.0"/>
  <text x="56" y="82" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" font-family="Menlo, Consolas, monospace">default, -ngl 99</text>
  <text x="56" y="100" text-anchor="start" font-size="10.5" fill="#666" font-weight="normal" >ErrorOutOfDeviceMemory on Vulkan, cudaMalloc failed on CUDA</text>
  <text x="580.0" y="92" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold" >does not load</text>
  <rect x="40" y="124" width="800" height="54" rx="4" fill="#fdfdfd" stroke="#ddd" stroke-width="1.0"/>
  <text x="56" y="144" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" font-family="Menlo, Consolas, monospace">--fit on (auto split)</text>
  <text x="56" y="162" text-anchor="start" font-size="10.5" fill="#666" font-weight="normal" >Vulkan, 21590 MiB GPU + 4041 MiB CPU</text>
  <rect x="430" y="136" width="300" height="16" rx="2" fill="#f4f4f4" stroke="#ccc" stroke-width="1.0"/>
  <line x1="713.4307692307692" y1="132" x2="713.4307692307692" y2="156" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="430" y="136" width="249.1153846153846" height="16" rx="2" fill="#eef4fa" stroke="#2e7d52" stroke-width="1.3"/>
  <text x="740" y="148" text-anchor="start" font-size="11.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">8.94 tok/s</text>
  <rect x="40" y="186" width="800" height="54" rx="4" fill="#fdfdfd" stroke="#ddd" stroke-width="1.0"/>
  <text x="56" y="206" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" font-family="Menlo, Consolas, monospace">GGML_VK_ALLOW_SYSMEM_FALLBACK=1</text>
  <text x="56" y="224" text-anchor="start" font-size="10.5" fill="#666" font-weight="normal" >Vulkan, 25023 MiB of model buffer on a 24564 MiB card</text>
  <rect x="430" y="198" width="300" height="16" rx="2" fill="#f4f4f4" stroke="#ccc" stroke-width="1.0"/>
  <line x1="713.4307692307692" y1="194" x2="713.4307692307692" y2="218" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="430" y="198" width="288.7269230769231" height="16" rx="2" fill="#eef4fa" stroke="#b8681c" stroke-width="1.3"/>
  <text x="740" y="210" text-anchor="start" font-size="11.5" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">6.32 tok/s</text>
  <rect x="40" y="248" width="800" height="54" rx="4" fill="#fdfdfd" stroke="#ddd" stroke-width="1.0"/>
  <text x="56" y="268" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" font-family="Menlo, Consolas, monospace">-ngl 40 (manual split)</text>
  <text x="56" y="286" text-anchor="start" font-size="10.5" fill="#666" font-weight="normal" >Vulkan, 15486 MiB GPU + 10145 MiB CPU</text>
  <rect x="430" y="260" width="300" height="16" rx="2" fill="#f4f4f4" stroke="#ccc" stroke-width="1.0"/>
  <line x1="713.4307692307692" y1="256" x2="713.4307692307692" y2="280" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="430" y="260" width="178.6846153846154" height="16" rx="2" fill="#eef4fa" stroke="#2c5f8a" stroke-width="1.3"/>
  <text x="740" y="272" text-anchor="start" font-size="11.5" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">3.28 tok/s</text>
  <rect x="40" y="310" width="800" height="54" rx="4" fill="#fdfdfd" stroke="#ddd" stroke-width="1.0"/>
  <text x="56" y="330" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" font-family="Menlo, Consolas, monospace">-ngl 0 (CPU only)</text>
  <text x="56" y="348" text-anchor="start" font-size="10.5" fill="#666" font-weight="normal" >all weights in system RAM, no GPU compute</text>
  <rect x="430" y="322" width="300" height="16" rx="2" fill="#f4f4f4" stroke="#ccc" stroke-width="1.0"/>
  <line x1="713.4307692307692" y1="318" x2="713.4307692307692" y2="342" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="430" y="322" width="6.0" height="16" rx="2" fill="#f7f7f7" stroke="#888" stroke-width="1.3"/>
  <text x="740" y="334" text-anchor="start" font-size="11.5" fill="#888" font-weight="bold" font-family="Menlo, Consolas, monospace">1.64 tok/s</text>
  <rect x="40" y="372" width="800" height="54" rx="4" fill="#fdfdfd" stroke="#ddd" stroke-width="1.0"/>
  <text x="56" y="392" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" font-family="Menlo, Consolas, monospace">GGML_CUDA_ENABLE_UNIFIED_MEMORY=1</text>
  <text x="56" y="410" text-anchor="start" font-size="10.5" fill="#666" font-weight="normal" >CUDA, cudaMallocManaged, 21.3 GiB of host RAM consumed</text>
  <rect x="430" y="384" width="300" height="16" rx="2" fill="#f4f4f4" stroke="#ccc" stroke-width="1.0"/>
  <line x1="713.4307692307692" y1="380" x2="713.4307692307692" y2="404" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <rect x="430" y="384" width="288.7269230769231" height="16" rx="2" fill="#eef4fa" stroke="#6b4c9a" stroke-width="1.3"/>
  <text x="740" y="396" text-anchor="start" font-size="11.5" fill="#6b4c9a" font-weight="bold" font-family="Menlo, Consolas, monospace">0.204 tok/s</text>
  <text x="713.4307692307692" y="54" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="normal" >card capacity</text>
  <text x="440.0" y="466" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" >Reference: Qwen3-8B-Q8_0 fits with room to spare and runs at 97 tok/s on Vulkan, 103 tok/s on CUDA.</text>
  <text x="440.0" y="484" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" >Every option that exceeds the card is between 11x and 504x slower, and the bars show why: the slow ones are not on the GPU.</text>
</svg>
