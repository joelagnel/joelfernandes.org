<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="klp_try_switch_task returns success if the task already is in the target state, otherwise it checks the task is off CPU and its reliable stack holds no patched function, then switches it">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#888"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/></marker><marker id="arGr" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/></marker><marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#b8681c"/></marker><marker id="arP" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b4c9a"/></marker></defs>
<rect width="900" height="560" fill="#fff"/>
<text x="450.0" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" >klp_try_switch_task(): when a task may move to the target state</text>
<rect x="40" y="52" width="360" height="54" rx="6" fill="#fff" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
<text x="220" y="84" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" >patch_state == klp_target_state ?</text>
<rect x="480" y="56" width="390" height="46" rx="5" fill="#eef8f1" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.3"/>
<text x="675" y="84" text-anchor="middle" font-size="12" fill="#2e7d52" font-weight="normal" >yes: done, return true</text>
<line x1="400" y1="79" x2="480" y2="79" stroke="#2e7d52" stroke-width="1.8" marker-end="url(#arGr)"/>
<text x="440" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >yes</text>
<line x1="220" y1="106" x2="220" y2="130" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="238" y="122" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" >no</text>
<rect x="40" y="130" width="360" height="54" rx="6" fill="#fff" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
<text x="220" y="162" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" >reliable stack traces available ?</text>
<rect x="480" y="134" width="390" height="46" rx="5" fill="#fff4f2" fill-opacity="1.0" stroke="#c0392b" stroke-width="1.3"/>
<text x="675" y="162" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="normal" >no: return false, never switches this way</text>
<line x1="400" y1="157" x2="480" y2="157" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arR)"/>
<text x="440" y="150" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >no</text>
<line x1="220" y1="184" x2="220" y2="208" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="238" y="200" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" >yes</text>
<rect x="40" y="208" width="360" height="54" rx="6" fill="#fff" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
<text x="220" y="240" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" >task running on a CPU (not current) ?</text>
<rect x="480" y="212" width="390" height="46" rx="5" fill="#fff4f2" fill-opacity="1.0" stroke="#c0392b" stroke-width="1.3"/>
<text x="675" y="240" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="normal" >yes: -EBUSY, try again later</text>
<line x1="400" y1="235" x2="480" y2="235" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arR)"/>
<text x="440" y="228" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >yes</text>
<line x1="220" y1="262" x2="220" y2="286" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="238" y="278" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" >no</text>
<rect x="40" y="286" width="360" height="54" rx="6" fill="#fff" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
<text x="220" y="318" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" >stack_trace_save_tsk_reliable() worked ?</text>
<rect x="480" y="290" width="390" height="46" rx="5" fill="#fff4f2" fill-opacity="1.0" stroke="#c0392b" stroke-width="1.3"/>
<text x="675" y="318" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="normal" >no: -EINVAL, try again later</text>
<line x1="400" y1="313" x2="480" y2="313" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arR)"/>
<text x="440" y="306" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >no</text>
<line x1="220" y1="340" x2="220" y2="364" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="238" y="356" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" >yes</text>
<rect x="40" y="364" width="360" height="54" rx="6" fill="#fff" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
<text x="220" y="396" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" >a patched function's code is on the stack ?</text>
<rect x="480" y="368" width="390" height="46" rx="5" fill="#fff4f2" fill-opacity="1.0" stroke="#c0392b" stroke-width="1.3"/>
<text x="675" y="396" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="normal" >yes: -EADDRINUSE, try again later</text>
<line x1="400" y1="391" x2="480" y2="391" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arR)"/>
<text x="440" y="384" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >yes</text>
<line x1="220" y1="418" x2="220" y2="448" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="238" y="436" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" >no</text>
<rect x="40" y="448" width="360" height="62" rx="6" fill="#eef8f1" fill-opacity="1.0" stroke="#2e7d52" stroke-width="2"/>
<text x="220" y="472" text-anchor="middle" font-size="12" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">clear_tsk_thread_flag(TIF_PATCH_PENDING)</text>
<text x="220" y="494" text-anchor="middle" font-size="12" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">task->patch_state = klp_target_state</text>
<text x="675" y="482" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" >A task found running is not switched by this code at all:</text>
<text x="675" y="500" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" >it waits for one of the other switch points</text>
</svg>
