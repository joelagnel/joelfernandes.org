<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="One task's patch_state goes from idle to the initial state, to the target state, and back to idle; the global switch is func transition">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#888"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/></marker><marker id="arGr" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/></marker><marker id="arO" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#b8681c"/></marker><marker id="arP" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b4c9a"/></marker></defs>
<rect width="900" height="400" fill="#fff"/>
<text x="450.0" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" >One task's patch_state during a transition that enables a patch</text>
<rect x="30" y="70" width="180" height="64" rx="5" fill="#fff" fill-opacity="1.0" stroke="#888" stroke-width="2"/>
<text x="120" y="95" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" font-family="Menlo, Consolas, monospace">KLP_TRANSITION_IDLE</text>
<text x="120" y="118" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >patch_state = -1</text>
<rect x="250" y="70" width="180" height="64" rx="5" fill="#fff" fill-opacity="1.0" stroke="#b8681c" stroke-width="2"/>
<text x="340" y="95" text-anchor="middle" font-size="11" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">KLP_TRANSITION_UNPATCHED</text>
<text x="340" y="118" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >patch_state = 0</text>
<rect x="470" y="70" width="180" height="64" rx="5" fill="#fff" fill-opacity="1.0" stroke="#2e7d52" stroke-width="2"/>
<text x="560" y="95" text-anchor="middle" font-size="11" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">KLP_TRANSITION_PATCHED</text>
<text x="560" y="118" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >patch_state = 1</text>
<rect x="690" y="70" width="180" height="64" rx="5" fill="#fff" fill-opacity="1.0" stroke="#888" stroke-width="2"/>
<text x="780" y="95" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" font-family="Menlo, Consolas, monospace">KLP_TRANSITION_IDLE</text>
<text x="780" y="118" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >patch_state = -1</text>
<line x1="210" y1="102" x2="250" y2="102" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="230.0" y="150" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="normal" font-family="Menlo, Consolas, monospace">klp_init_transition()</text>
<text x="230.0" y="168" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >initial state: old code</text>
<line x1="430" y1="102" x2="470" y2="102" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="450.0" y="150" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="normal" font-family="Menlo, Consolas, monospace">task switches</text>
<text x="450.0" y="168" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >to the target state: new code</text>
<line x1="650" y1="102" x2="690" y2="102" stroke="#2c5f8a" stroke-width="2" marker-end="url(#ar)"/>
<text x="670.0" y="150" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="normal" font-family="Menlo, Consolas, monospace">klp_complete_transition()</text>
<text x="670.0" y="168" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" >back to idle</text>
<rect x="30" y="200" width="840" height="64" rx="6" fill="#f4f7fb" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.4"/>
<text x="450" y="224" text-anchor="middle" font-size="12.5" fill="#333" font-weight="normal" >While func->transition is true, every call of a patched function goes through klp_ftrace_handler()</text>
<text x="450" y="247" text-anchor="middle" font-size="12.5" fill="#333" font-weight="normal" >which reads current->patch_state: UNPATCHED runs the old code, anything else runs the new code</text>
<rect x="30" y="290" width="410" height="80" rx="6" fill="#fff" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.5"/>
<text x="235" y="314" text-anchor="middle" font-size="12.5" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">TIF_PATCH_PENDING</text>
<text x="235" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >set by klp_start_transition() on every task</text>
<text x="235" y="356" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >means: this task still has to move to the target state</text>
<rect x="460" y="290" width="410" height="80" rx="6" fill="#fff" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.5"/>
<text x="665" y="314" text-anchor="middle" font-size="12.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">klp_transition_patch, klp_target_state</text>
<text x="665" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >one global patch and one global target</text>
<text x="665" y="356" text-anchor="middle" font-size="12" fill="#444" font-weight="normal" >so one transition runs at a time</text>
</svg>
