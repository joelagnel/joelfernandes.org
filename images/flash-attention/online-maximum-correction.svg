<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1040" viewBox="0 0 820 1040" role="img" aria-labelledby="title desc">
<title id="title">Online softmax corrects earlier state when a new maximum arrives</title>
<desc id="desc">A first score tile contains scores one and two and establishes maximum two. A later score of four changes the maximum, so the current denominator and value numerator state are rescaled by exp of minus two before the new contribution is added.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="58" text-anchor="start" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">When a later tile finds a larger</text>
<text x="48" y="98" text-anchor="start" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">score, rescale the current state</text>
<text x="48" y="143" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">Online normalizer recurrence, applied to the value numerator too.</text>
<rect x="60" y="210" width="230" height="130" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="175.0" y="268.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#0f172a">tile 1 scores</text>
<text x="175.0" y="302.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#0f172a">[1, 2]</text>
<rect x="400" y="190" width="350" height="170" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
<text x="575.0" y="240.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">after tile 1</text>
<text x="575.0" y="270.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">m = 2</text>
<text x="575.0" y="300.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">l = exp(-1)+1</text>
<text x="575.0" y="330.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">o = exp(-1)*V0 + V1</text>
<path d="M290,275 L400,275" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="100" y="455" width="620" height="155" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
<text x="410.0" y="512.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">r = exp(m - m&#x27;) = exp(-2)</text>
<text x="410.0" y="542.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a"></text>
<text x="410.0" y="572.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">m was 2.  r puts l and o on m&#x27;=4&#x27;s scale.</text>
<path d="M575,360 L410,455" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="60" y="720" width="230" height="125" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="175.0" y="775.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#0f172a">tile 2 score</text>
<text x="175.0" y="809.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#0f172a">[4]</text>
<rect x="400" y="695" width="350" height="170" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
<text x="575.0" y="745.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">after tile 2</text>
<text x="575.0" y="775.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">m&#x27; = 4</text>
<text x="575.0" y="805.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">l = r*l + 1</text>
<text x="575.0" y="835.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">o = r*o + V2</text>
<path d="M290,782 L400,782" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M720,532 L775,532 L775,780 L750,780" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
</svg>
