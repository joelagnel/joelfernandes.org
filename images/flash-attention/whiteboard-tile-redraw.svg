<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1150" viewBox="0 0 820 1150" role="img" aria-labelledby="title desc">
<title id="title">A whiteboard-derived redraw of row two processed in two K and V tiles</title>
<desc id="desc">HBM holds K and V in a two-row tile followed by a one-row tile. For query row two, temporary score weights are immediately multiplied by full V vectors and combined into m, l, and o on chip.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="58" text-anchor="start" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Tile-local scores become</text>
<text x="48" y="100" text-anchor="start" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">value-vector contributions immediately</text>
<text x="48" y="145" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">Whiteboard-informed redraw: no full T x T score matrix reaches HBM.</text>
<rect x="55" y="195" width="300" height="405" rx="16" fill="#fce7f3" stroke="#be185d" stroke-width="3"/>
<text x="205" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">HBM / VRAM</text>
<rect x="90" y="295" width="230" height="120" rx="16" fill="#fce7f3" stroke="#be185d" stroke-width="3"/>
<text x="205.0" y="333.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">K / V tile 1</text>
<text x="205.0" y="365.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">K0,V0</text>
<text x="205.0" y="397.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">K1,V1</text>
<rect x="90" y="465" width="230" height="90" rx="16" fill="#fce7f3" stroke="#be185d" stroke-width="3"/>
<text x="205.0" y="503.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">K / V tile 2</text>
<text x="205.0" y="535.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">K2,V2</text>
<rect x="440" y="195" width="325" height="405" rx="16" fill="#ecfccb" stroke="#4d7c0f" stroke-width="3"/>
<text x="602" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">on-chip SRAM</text>
<rect x="482" y="295" width="240" height="210" rx="16" fill="#ecfccb" stroke="#4d7c0f" stroke-width="3"/>
<text x="602.0" y="346.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">Q2</text>
<text x="602.0" y="379.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a"></text>
<text x="602.0" y="412.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">fresh state</text>
<text x="602.0" y="445.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">m=-inf, l=0</text>
<text x="602.0" y="478.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">o=[0,0]</text>
<path d="M320,355 L482,355" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M320,510 L482,510" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="70" y="670" width="680" height="135" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="410.0" y="730.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">tile 1: S=[0,0], weights=[1,1]</text>
<text x="410.0" y="763.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">1*V0 + 1*V1  =&gt;  o=[10,20], l=2</text>
<rect x="70" y="845" width="680" height="135" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
<text x="410.0" y="905.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">tile 2: S=[0], weight=1</text>
<text x="410.0" y="938.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#0f172a">1*V2  =&gt;  o=[40,50], l=3</text>
<rect x="165" y="1020" width="490" height="88" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
<text x="410.0" y="1072.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">final: Y2 = o / l = [13.333, 16.667]</text>
<path d="M602,505 L410,670" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M410,805 L410,845" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M410,980 L410,1020" stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
</svg>
