<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="#ffffff"/>
  <text x="400.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Which knob moves which part of VRAM</text>
  <rect x="220" y="280" width="170" height="120" rx="4" fill="#e8eef4" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="305.0" y="345.0" text-anchor="middle" font-size="12.5" fill="#2c5f8a" font-weight="bold" font-style="normal">model weights</text>
  <rect x="220" y="170" width="170" height="110" rx="4" fill="#e9f2ec" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.4"/>
  <text x="305.0" y="230.0" text-anchor="middle" font-size="12.5" fill="#2e7d52" font-weight="bold" font-style="normal">KV cache</text>
  <rect x="220" y="52" width="170" height="118" rx="4" fill="#fbeeea" fill-opacity="1.0" stroke="#c0392b" stroke-width="1.4"/>
  <text x="305.0" y="116.0" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="bold" font-style="normal">compute workspace</text>
  <text x="305.0" y="426" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" font-style="normal">-ub 512</text>
  <text x="305.0" y="444" text-anchor="middle" font-size="11" fill="#777" font-weight="normal" font-style="normal">one active sequence</text>
  <rect x="470" y="280" width="170" height="120" rx="4" fill="#e8eef4" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="555.0" y="345.0" text-anchor="middle" font-size="12.5" fill="#2c5f8a" font-weight="bold" font-style="normal">model weights</text>
  <rect x="470" y="170" width="170" height="110" rx="4" fill="#e9f2ec" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.4"/>
  <text x="555.0" y="230.0" text-anchor="middle" font-size="12.5" fill="#2e7d52" font-weight="bold" font-style="normal">KV cache</text>
  <rect x="470" y="136" width="170" height="34" rx="4" fill="#fbeeea" fill-opacity="1.0" stroke="#c0392b" stroke-width="1.4"/>
  <text x="555.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="bold" font-style="normal">compute workspace</text>
  <text x="555.0" y="426" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" font-style="normal">-ub 128</text>
  <text x="555.0" y="444" text-anchor="middle" font-size="11" fill="#777" font-weight="normal" font-style="normal">same -c, smaller chunk</text>
  <line x1="398" y1="62" x2="460" y2="142" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arRed)"/>
  <text x="430.0" y="46" text-anchor="middle" font-size="11.5" fill="#c0392b" font-weight="bold" font-style="normal">-ub moves this</text>
  <text x="198" y="340" text-anchor="end" font-size="11" fill="#2c5f8a" font-weight="normal" font-style="normal">unchanged by any of</text>
  <text x="198" y="356" text-anchor="end" font-size="11" fill="#2c5f8a" font-weight="normal" font-style="normal">these three knobs</text>
  <line x1="204" y1="346" x2="216" y2="340" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="198" y="233" text-anchor="end" font-size="11" fill="#2e7d52" font-weight="normal" font-style="normal">-c, and the KV</text>
  <text x="198" y="249" text-anchor="end" font-size="11" fill="#2e7d52" font-weight="normal" font-style="normal">cache precision</text>
  <line x1="204" y1="239" x2="216" y2="235" stroke="#2e7d52" stroke-width="1.2"/>
  <text x="400.0" y="494" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="normal">Lowering -ub shrinks the reserved workspace. It leaves the KV cache alone,</text>
  <text x="400.0" y="512" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="normal">so it is not the knob to reach for when the context itself is what does not fit.</text>
</svg>
