<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="800" height="350" fill="#ffffff"/>
  <text x="400.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Prefill and decode do very different amounts of work per pass</text>
  <text x="60" y="64" text-anchor="start" font-size="12.5" fill="#2c5f8a" font-weight="bold" font-style="normal">Prefill: the tokens are already known</text>
  <rect x="60" y="80" width="88" height="52" rx="4" fill="#e8eef4" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="104" y="104" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal">0&#8211;127</text>
  <text x="104" y="121" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal">128 tokens</text>
  <rect x="156" y="80" width="88" height="52" rx="4" fill="#e8eef4" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="200" y="104" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal">128&#8211;255</text>
  <text x="200" y="121" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal">128 tokens</text>
  <rect x="252" y="80" width="88" height="52" rx="4" fill="#e8eef4" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="296" y="104" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal">256&#8211;383</text>
  <text x="296" y="121" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal">128 tokens</text>
  <rect x="348" y="80" width="88" height="52" rx="4" fill="#e8eef4" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="392" y="104" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal">384&#8211;511</text>
  <text x="392" y="121" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal">128 tokens</text>
  <text x="466" y="110" text-anchor="middle" font-size="16" fill="#999" font-weight="normal" font-style="normal">&#8230;</text>
  <text x="60" y="158" text-anchor="start" font-size="11.5" fill="#777" font-weight="normal" font-style="normal">one forward pass per chunk, up to n_ubatch token positions at a time</text>
  <text x="60" y="189" text-anchor="start" font-size="12.5" fill="#b8681c" font-weight="bold" font-style="normal">Decode: each next token has to be sampled before the one after it exists</text>
  <rect x="60" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="86" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="112" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="138" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="164" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="190" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="216" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="242" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="268" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="294" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="320" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="346" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="372" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <rect x="398" y="205" width="18" height="52" rx="3" fill="#fdf3e8" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.3"/>
  <text x="442" y="237" text-anchor="middle" font-size="16" fill="#999" font-weight="normal" font-style="normal">&#8230;</text>
  <text x="60" y="283" text-anchor="start" font-size="11.5" fill="#777" font-weight="normal" font-style="normal">one forward pass per token, and with a single sequence that pass has one row</text>
  <text x="400.0" y="336" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="normal">n_ubatch is the ceiling on the left. On the right it is mostly unused capacity.</text>
</svg>
