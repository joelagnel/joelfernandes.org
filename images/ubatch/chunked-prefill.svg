<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Chunked prefill: the same total work, a much smaller live piece</text>
  <text x="215.0" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">all at once</text>
  <rect x="90" y="90" width="250" height="250" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
  <path d="M 90 90 L 340 340 L 90 340 Z" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="170.0" y="270.0" text-anchor="middle" font-size="13" fill="#2c5f8a" font-weight="bold">live</text>
  <text x="215.0" y="364" text-anchor="middle" font-size="11.5" fill="#777" font-weight="normal">peak working set: the whole triangle</text>
  <text x="575.0" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">in chunks of U</text>
  <rect x="450" y="90" width="250" height="250" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
  <path d="M 450 90.0 L 500.0 140.0 L 450 140.0 Z" fill="#eeeeee" stroke="#ccc" stroke-width="1"/>
  <rect x="450" y="90.0" width="0.0" height="50.0" fill="#eeeeee" stroke="#ccc" stroke-width="1"/>
  <path d="M 450 140.0 L 550.0 190.0 L 450 190.0 Z" fill="#eeeeee" stroke="#ccc" stroke-width="1"/>
  <rect x="450" y="140.0" width="50.0" height="50.0" fill="#eeeeee" stroke="#ccc" stroke-width="1"/>
  <path d="M 450 190.0 L 600.0 240.0 L 450 240.0 Z" fill="#eeeeee" stroke="#ccc" stroke-width="1"/>
  <rect x="450" y="190.0" width="100.0" height="50.0" fill="#eeeeee" stroke="#ccc" stroke-width="1"/>
  <path d="M 450 240.0 L 650.0 290.0 L 450 290.0 Z" fill="#fbeeea" stroke="#c0392b" stroke-width="1.4"/>
  <rect x="450" y="240.0" width="150.0" height="50.0" fill="#fbeeea" stroke="#c0392b" stroke-width="1.4"/>
  <path d="M 450 290.0 L 700.0 340.0 L 450 340.0 Z" fill="#ffffff" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="450" y="290.0" width="200.0" height="50.0" fill="#ffffff" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="714" y1="240.0" x2="714" y2="290.0" stroke="#c0392b" stroke-width="2"/>
  <text x="722" y="259.0" text-anchor="start" font-size="11" fill="#c0392b" font-weight="bold">U rows,</text>
  <text x="722" y="274.0" text-anchor="start" font-size="11" fill="#c0392b" font-weight="bold">live now</text>
  <text x="496" y="120" text-anchor="start" font-size="10.5" fill="#999" font-weight="normal">done, now in</text>
  <text x="496" y="134" text-anchor="start" font-size="10.5" fill="#999" font-weight="normal">the KV cache</text>
  <text x="575.0" y="364" text-anchor="middle" font-size="11.5" fill="#777" font-weight="normal">peak working set: one strip</text>
  <text x="400.0" y="390" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">The shaded area is the same in both pictures, so the arithmetic is roughly the same.</text>
  <text x="400.0" y="408" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">What changes is how much of it has to be in flight at any one moment.</text>
</svg>
