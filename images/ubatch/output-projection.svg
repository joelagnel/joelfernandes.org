  <text x="220.0" y="468" text-anchor="middle" font-size="11" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 2</text>
  <rect x="110" y="486" width="220" height="34" rx="4" fill="#e9f2ec" stroke="#2e7d52" stroke-width="1.4"/>
  <line x1="165.0" y1="486" x2="165.0" y2="520" stroke="#2e7d52" stroke-width="0.7" stroke-dasharray="2 2"/>
  <line x1="220.0" y1="486" x2="220.0" y2="520" stroke="#2e7d52" stroke-width="0.7" stroke-dasharray="2 2"/>
  <line x1="275.0" y1="486" x2="275.0" y2="520" stroke="#2e7d52" stroke-width="0.7" stroke-dasharray="2 2"/>
  <line x1="330.0" y1="486" x2="330.0" y2="520" stroke="#2e7d52" stroke-width="0.7" stroke-dasharray="2 2"/>
  <text x="220.0" y="508" text-anchor="middle" font-size="11" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 1</text>
  <rect x="400" y="370" width="76" height="146" rx="4" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <text x="438" y="448.0" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">W_O</text>
  <text x="635.0" y="342" text-anchor="middle" font-size="11" fill="#777" font-weight="normal">layer output</text>
  <text x="635.0" y="356" text-anchor="middle" font-size="10" fill="#999" font-weight="normal" font-family="Menlo, Consolas, monospace">[rows, d]</text>
  <line x1="334" y1="383.0" x2="552" y2="383.0" stroke="#2c5f8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="560" y="366" width="150" height="34" rx="4" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="635.0" y="388" text-anchor="middle" font-size="11" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 0</text>
  <line x1="334" y1="423.0" x2="552" y2="423.0" stroke="#2e7d52" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="560" y="406" width="150" height="34" rx="4" fill="#e9f2ec" stroke="#2e7d52" stroke-width="1.4"/>
  <text x="635.0" y="428" text-anchor="middle" font-size="11" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 1</text>
  <line x1="334" y1="463.0" x2="552" y2="463.0" stroke="#b8681c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="560" y="446" width="150" height="34" rx="4" fill="#fdf3e8" stroke="#b8681c" stroke-width="1.4"/>
  <text x="635.0" y="468" text-anchor="middle" font-size="11" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 2</text>
  <line x1="334" y1="503.0" x2="552" y2="503.0" stroke="#2e7d52" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="560" y="486" width="150" height="34" rx="4" fill="#e9f2ec" stroke="#2e7d52" stroke-width="1.4"/>
  <text x="635.0" y="508" text-anchor="middle" font-size="11" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 1</text>
  <path d="M 340 383.0 C 480 383.0, 480 463.0, 550 463.0" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="500" y1="411.0" x2="524" y2="435.0" stroke="#c0392b" stroke-width="3"/>
  <line x1="524" y1="411.0" x2="500" y2="435.0" stroke="#c0392b" stroke-width="3"/>
  <line x1="512" y1="439.0" x2="512" y2="538" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="504" y="552" text-anchor="end" font-size="11" fill="#c0392b" font-weight="bold">there is no path from one row into another row's output:</text>
  <text x="504" y="568" text-anchor="end" font-size="11" fill="#c0392b" font-weight="normal">the matmul contracts the feature axis, and leaves rows alone</text>
  <text x="410.0" y="620" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">So heads do get combined, but only within a row. The row index is carried straight</text>
  <text x="410.0" y="638" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">through, which is why a token from one conversation cannot land in another's output.</text>
</svg>
