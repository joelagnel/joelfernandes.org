  <rect x="110" y="446" width="220" height="34" rx="4" fill="#fdf3e8" stroke="#b8681c" stroke-width="1.4"/>
  <line x1="165.0" y1="446" x2="165.0" y2="480" stroke="#b8681c" stroke-width="0.7" stroke-dasharray="2 2"/>
  <line x1="220.0" y1="446" x2="220.0" y2="480" stroke="#b8681c" stroke-width="0.7" stroke-dasharray="2 2"/>
  <line x1="275.0" y1="446" x2="275.0" y2="480" stroke="#b8681c" stroke-width="0.7" stroke-dasharray="2 2"/>
