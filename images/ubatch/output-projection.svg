  <text x="427.0" y="114" text-anchor="middle" font-size="9" fill="#8aa" font-weight="normal" font-family="Menlo, Consolas, monospace">d_head</text>
  <text x="138" y="106" text-anchor="end" font-size="11.5" fill="#2c5f8a" font-weight="bold">token i</text>
  <path d="M 150 130 L 150 137 L 464 137 L 464 130" fill="none" stroke="#888" stroke-width="1.3"/>
  <text x="307.0" y="154" text-anchor="middle" font-size="11" fill="#777" font-weight="normal">concatenated along the feature axis</text>
  <line x1="307.0" y1="162" x2="307.0" y2="184" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="252.0" y="188" width="110" height="34" rx="4" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <text x="307.0" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">W_O</text>
  <line x1="307.0" y1="228" x2="307.0" y2="248" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="252.0" y="252" width="110" height="34" rx="4" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="307.0" y="274" text-anchor="middle" font-size="11" fill="#2c5f8a" font-weight="bold">token i out</text>
  <text x="504" y="200" text-anchor="start" font-size="11" fill="#777" font-weight="normal">the four heads for token i are</text>
  <text x="504" y="215" text-anchor="start" font-size="11" fill="#777" font-weight="normal">blended together here, which is</text>
  <text x="504" y="230" text-anchor="start" font-size="11" fill="#777" font-weight="normal">the whole point of this layer</text>
  <text x="410.0" y="318" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B.  what happens across rows</text>
  <text x="220.0" y="342" text-anchor="middle" font-size="11" fill="#777" font-weight="normal">concatenated heads</text>
  <text x="220.0" y="356" text-anchor="middle" font-size="10" fill="#999" font-weight="normal" font-family="Menlo, Consolas, monospace">[rows, n_head &#215; d_head]</text>
  <rect x="110" y="366" width="220" height="34" rx="4" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.4"/>
  <line x1="165.0" y1="366" x2="165.0" y2="400" stroke="#2c5f8a" stroke-width="0.7" stroke-dasharray="2 2"/>
