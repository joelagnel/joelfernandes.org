  <rect width="820" height="660" fill="#ffffff"/>
  <text x="410.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The output projection mixes heads, not tokens</text>
  <text x="410.0" y="58" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A.  what happens inside a single row</text>
  <rect x="150" y="82" width="74" height="40" rx="4" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="187.0" y="100" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="bold">head 0</text>
  <text x="187.0" y="114" text-anchor="middle" font-size="9" fill="#8aa" font-weight="normal" font-family="Menlo, Consolas, monospace">d_head</text>
  <rect x="230" y="82" width="74" height="40" rx="4" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.4"/>
  <text x="267.0" y="100" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="bold">head 1</text>
  <text x="267.0" y="114" text-anchor="middle" font-size="9" fill="#8aa" font-weight="normal" font-family="Menlo, Consolas, monospace">d_head</text>
