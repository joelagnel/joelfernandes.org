<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The feed-forward block: one set of weights, rows that never meet</text>
  <text x="145.0" y="76" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">input rows</text>
  <text x="145.0" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-family="Menlo, Consolas, monospace">[4, d]</text>
  <rect x="70" y="100" width="150" height="40" rx="4" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="145.0" y="125" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 0</text>
  <rect x="70" y="148" width="150" height="40" rx="4" fill="#e9f2ec" stroke="#2e7d52" stroke-width="1.5"/>
  <text x="145.0" y="173" text-anchor="middle" font-size="11.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 1</text>
  <rect x="70" y="196" width="150" height="40" rx="4" fill="#e9f2ec" stroke="#2e7d52" stroke-width="1.5"/>
  <text x="145.0" y="221" text-anchor="middle" font-size="11.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 1</text>
  <rect x="70" y="244" width="150" height="40" rx="4" fill="#fdf3e8" stroke="#b8681c" stroke-width="1.5"/>
  <text x="145.0" y="269" text-anchor="middle" font-size="11.5" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 2</text>
  <line x1="224" y1="120.0" x2="572" y2="120.0" stroke="#2c5f8a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <line x1="224" y1="168.0" x2="572" y2="168.0" stroke="#2e7d52" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="224" y1="216.0" x2="572" y2="216.0" stroke="#2e7d52" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="224" y1="264.0" x2="572" y2="264.0" stroke="#b8681c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="340" y="96" width="110" height="188" rx="4" fill="#f2f2f2" stroke="#333" stroke-width="1.6"/>
  <text x="395" y="184.0" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">W</text>
  <text x="395" y="206.0" text-anchor="middle" font-size="11" fill="#777" font-weight="normal" font-family="Menlo, Consolas, monospace">[d, f]</text>
  <text x="395" y="306" text-anchor="middle" font-size="11" fill="#777" font-weight="normal">one weight matrix,</text>
  <text x="395" y="321" text-anchor="middle" font-size="11" fill="#777" font-weight="normal">applied to every row</text>
  <text x="655.0" y="76" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">output rows</text>
  <text x="655.0" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-family="Menlo, Consolas, monospace">[4, f]</text>
  <rect x="580" y="100" width="150" height="40" rx="4" fill="#e8eef4" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="655.0" y="125" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 0</text>
  <rect x="580" y="148" width="150" height="40" rx="4" fill="#e9f2ec" stroke="#2e7d52" stroke-width="1.5"/>
  <text x="655.0" y="173" text-anchor="middle" font-size="11.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 1</text>
  <rect x="580" y="196" width="150" height="40" rx="4" fill="#e9f2ec" stroke="#2e7d52" stroke-width="1.5"/>
  <text x="655.0" y="221" text-anchor="middle" font-size="11.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 1</text>
  <rect x="580" y="244" width="150" height="40" rx="4" fill="#fdf3e8" stroke="#b8681c" stroke-width="1.5"/>
  <text x="655.0" y="269" text-anchor="middle" font-size="11.5" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">seq 2</text>
  <text x="400.0" y="362" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">Row 2 of the output is built only from row 2 of the input. Nothing here can carry a</text>
  <text x="400.0" y="380" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">value from one conversation into another, no matter how the rows are arranged.</text>
  <text x="400.0" y="404" text-anchor="middle" font-size="11.5" fill="#888" font-weight="normal">This is also where batching pays off: the weights are fetched once and shared by all four rows.</text>
</svg>
