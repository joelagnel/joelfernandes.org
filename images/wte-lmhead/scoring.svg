  <text x="390.0" y="300" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">logit for row i  =  dot(x, wte[i])</text>
  <text x="390.0" y="326" text-anchor="middle" font-size="11.5" fill="#555" font-weight="normal" font-style="normal" >Doing all 50257 dot products at once is one matrix multiply:</text>
  <text x="390.0" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">logits = x @ wte.T</text>
  <text x="390.0" y="372" text-anchor="middle" font-size="11.5" fill="#777" font-weight="normal" font-style="normal" >The row for the input token " is" scores low. Rows that could come next score high.</text>
