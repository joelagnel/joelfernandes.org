<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/>
    </marker>
    <marker id="arOrange" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b8681c"/>
    </marker>
    <marker id="arPurple" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b4d8f"/>
    </marker>
  </defs>
  <rect width="780" height="430" fill="#ffffff"/>
  <text x="390.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Two updates land on the same row and are added</text>
  <text x="390.0" y="46" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="italic" >Angle is drawn to the measured cosine of -0.007, essentially a right angle.</text>
  <text x="390.0" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" font-style="italic" >Lengths are not to scale: lm_head is really 80x wte, drawn 3x so both stay visible.</text>
  <line x1="418" y1="242" x2="401" y2="185" stroke="#ccc" stroke-width="1.0" stroke-dasharray="4,3"/>
  <line x1="215" y1="239" x2="401" y2="185" stroke="#ccc" stroke-width="1.0" stroke-dasharray="4,3"/>
  <line x1="232" y1="296" x2="418" y2="242" stroke="#b8681c" stroke-width="2.4" marker-end="url(#arOrange)"/>
  <line x1="232" y1="296" x2="215" y2="239" stroke="#2c5f8a" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="232" y1="296" x2="401" y2="185" stroke="#2e7d52" stroke-width="3.0" marker-end="url(#arGreen)"/>
  <circle cx="232" cy="296" r="5" fill="#333" fill-opacity="1.0" stroke="none" stroke-width="1.0"/>
  <text x="224" y="322" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" font-style="normal" >wte.weight[4171]</text>
  <text x="224" y="335" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" font-style="normal" >before the step</text>
  <text x="412" y="276" text-anchor="end" font-size="11.5" fill="#b8681c" font-weight="bold" font-style="normal" >from lm_head</text>
  <text x="412" y="290" text-anchor="end" font-size="10" fill="#777" font-weight="normal" font-style="normal" >pulls it toward being a detector</text>
  <text x="199" y="241" text-anchor="end" font-size="11.5" fill="#2c5f8a" font-weight="bold" font-style="normal" >from wte</text>
  <text x="199" y="255" text-anchor="end" font-size="10" fill="#777" font-weight="normal" font-style="normal" >pulls it toward being</text>
  <text x="199" y="268" text-anchor="end" font-size="10" fill="#777" font-weight="normal" font-style="normal" >a representation</text>
  <text x="387" y="155" text-anchor="end" font-size="12" fill="#2e7d52" font-weight="bold" font-style="normal" >sum</text>
  <text x="387" y="169" text-anchor="end" font-size="10" fill="#2e7d52" font-weight="normal" font-style="normal" >the update actually applied</text>
  <rect x="498" y="128" width="250" height="202" rx="4" fill="#fcfcfc" fill-opacity="1.0" stroke="#ccc" stroke-width="1.4"/>
  <text x="623" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" font-style="normal" >measured, one backward pass</text>
  <text x="510" y="182" text-anchor="start" font-size="9.5" fill="#666" font-weight="normal" font-style="normal" >rows both paths touch</text>
  <text x="736" y="182" text-anchor="end" font-size="9.5" fill="#333" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">84</text>
  <text x="510" y="205" text-anchor="start" font-size="9.5" fill="#666" font-weight="normal" font-style="normal" >cosine, mean</text>
  <text x="736" y="205" text-anchor="end" font-size="9.5" fill="#333" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">-0.0069</text>
  <text x="510" y="228" text-anchor="start" font-size="9.5" fill="#666" font-weight="normal" font-style="normal" >cosine, sd</text>
  <text x="736" y="228" text-anchor="end" font-size="9.5" fill="#333" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">0.0463</text>
  <text x="510" y="251" text-anchor="start" font-size="9.5" fill="#666" font-weight="normal" font-style="normal" >share with cosine below 0</text>
  <text x="736" y="251" text-anchor="end" font-size="9.5" fill="#333" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">54.8%</text>
  <rect x="510" y="266" width="9" height="9" rx="2" fill="#b8681c" fill-opacity="1.0" stroke="#b8681c" stroke-width="0.0"/>
  <text x="525" y="274" text-anchor="start" font-size="9.5" fill="#666" font-weight="normal" font-style="normal" >per-row norm, lm_head</text>
  <text x="736" y="274" text-anchor="end" font-size="9.5" fill="#333" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">2.004</text>
  <rect x="510" y="289" width="9" height="9" rx="2" fill="#2c5f8a" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="0.0"/>
  <text x="525" y="297" text-anchor="start" font-size="9.5" fill="#666" font-weight="normal" font-style="normal" >per-row norm, wte</text>
  <text x="736" y="297" text-anchor="end" font-size="9.5" fill="#333" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">0.025</text>
  <text x="390.0" y="384" text-anchor="middle" font-size="11.5" fill="#555" font-weight="normal" font-style="normal" >A shuffled control gives the same tilt, so these two are best read as</text>
  <text x="390.0" y="402" text-anchor="middle" font-size="11.5" fill="#555" font-weight="normal" font-style="normal" >unrelated directions, not opposing forces. The optimizer adds them either way.</text>
</svg>
