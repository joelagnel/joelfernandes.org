<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/>
    </marker>
    <marker id="arOrange" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b8681c"/>
    </marker>
    <marker id="arPurple" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b4d8f"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The forward pass, with the real shapes of a 2 x 3 batch</text>
  <text x="300" y="56" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">idx  (2, 3)  int64</text>
  <text x="300" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="normal" font-style="normal" >2 sequences, 3 token ids each</text>
  <line x1="300" y1="80" x2="300" y2="102" stroke="#888" stroke-width="1.5" marker-end="url(#arGrey)"/>
  <rect x="150.0" y="108" width="300" height="40" rx="4" fill="#f7fafc" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
  <text x="300" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">wte(idx)</text>
  <text x="300" y="141" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal" >look up one row per id</text>
  <text x="300" y="164" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">tok_emb  (2, 3, 768)</text>
  <line x1="300" y1="172" x2="300" y2="194" stroke="#888" stroke-width="1.5" marker-end="url(#arGrey)"/>
  <rect x="150.0" y="206" width="300" height="40" rx="4" fill="#f7fafc" fill-opacity="1.0" stroke="#888" stroke-width="1.6"/>
  <text x="300" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">+ wpe(pos)</text>
  <text x="300" y="239" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal" >add position rows, (3, 768)</text>
  <text x="300" y="262" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">x  (2, 3, 768)</text>
  <line x1="300" y1="270" x2="300" y2="292" stroke="#888" stroke-width="1.5" marker-end="url(#arGrey)"/>
  <rect x="150.0" y="304" width="300" height="56" rx="4" fill="#f6f6f6" fill-opacity="1.0" stroke="#888" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="300" y="326" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">12 x Block</text>
  <text x="300" y="342" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal" >shape never changes</text>
  <text x="300" y="378" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">x  (2, 3, 768)</text>
  <line x1="300" y1="386" x2="300" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arGrey)"/>
  <rect x="150.0" y="420" width="300" height="40" rx="4" fill="#fffaf5" fill-opacity="1.0" stroke="#b8681c" stroke-width="1.6"/>
  <text x="300" y="439" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">lm_head(x)</text>
  <text x="300" y="453" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal" >score x against all 50257 rows</text>
  <text x="300" y="476" text-anchor="middle" font-size="11.5" fill="#2c5f8a" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">logits  (2, 3, 50257)</text>
  <line x1="300" y1="484" x2="300" y2="506" stroke="#888" stroke-width="1.5" marker-end="url(#arGrey)"/>
  <rect x="150.0" y="518" width="300" height="40" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#c0392b" stroke-width="1.6"/>
  <text x="300" y="537" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">softmax</text>
  <text x="300" y="551" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" font-style="normal" >one probability per vocabulary entry</text>
  <path d="M 150.0 128 L 106.0 128 L 106.0 440 L 150.0 440" stroke="#6b4d8f" stroke-width="1.8" fill="none" stroke-dasharray="6,4"/>
  <text x="98.0" y="270.0" text-anchor="end" font-size="11.5" fill="#6b4d8f" font-weight="bold" font-style="normal" >the same</text>
  <text x="98.0" y="284.0" text-anchor="end" font-size="11.5" fill="#6b4d8f" font-weight="normal" font-style="normal" font-family="SFMono-Regular, Consolas, Menlo, monospace">50257 x 768</text>
  <text x="98.0" y="298.0" text-anchor="end" font-size="11.5" fill="#6b4d8f" font-weight="bold" font-style="normal" >tensor</text>
</svg>
