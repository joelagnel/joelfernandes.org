<svg xmlns="http://www.w3.org/2000/svg" width="600" height="272" viewBox="0 0 600 272" role="img" aria-labelledby="title desc"><title id="title">Write: a value-key outer product</title><desc id="desc">Value column [3,1,2] transpose times key row [1,0] gives the 3 by 2 outer product with rows [3,0], [1,0], [2,0]. This matrix can be added to the state.</desc><rect width="100%" height="100%" rx="8" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif"><text x="300" y="31" font-size="26" fill="#17333b" text-anchor="middle" font-weight="bold">Write an association: v kᵀ</text><text x="85" y="72" font-size="25" fill="#80500b" text-anchor="middle" font-weight="normal">v</text><text x="275" y="72" font-size="25" fill="#315fa3" text-anchor="middle" font-weight="normal">kᵀ</text><text x="485" y="72" font-size="25" fill="#236e65" text-anchor="middle" font-weight="normal">v kᵀ</text><path d="M59 84 H50 V196 H59" fill="none" stroke="#80500b" stroke-width="2.5"/><path d="M111 84 H120 V196 H111" fill="none" stroke="#80500b" stroke-width="2.5"/><text x="85" y="112" font-size="29" fill="#80500b" text-anchor="middle" font-weight="normal">3</text><text x="85" y="148" font-size="29" fill="#80500b" text-anchor="middle" font-weight="normal">1</text><text x="85" y="184" font-size="29" fill="#80500b" text-anchor="middle" font-weight="normal">2</text><text x="170" y="148" font-size="31" fill="#17333b" text-anchor="middle" font-weight="normal">×</text><path d="M219 120 H210 V160 H219" fill="none" stroke="#315fa3" stroke-width="2.5"/><path d="M331 120 H340 V160 H331" fill="none" stroke="#315fa3" stroke-width="2.5"/><text x="245" y="148" font-size="29" fill="#315fa3" text-anchor="middle" font-weight="normal">1</text><text x="305" y="148" font-size="29" fill="#315fa3" text-anchor="middle" font-weight="normal">0</text><text x="385" y="148" font-size="31" fill="#17333b" text-anchor="middle" font-weight="normal">=</text><path d="M429 84 H420 V196 H429" fill="none" stroke="#236e65" stroke-width="2.5"/><path d="M541 84 H550 V196 H541" fill="none" stroke="#236e65" stroke-width="2.5"/><text x="455" y="112" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">3</text><text x="515" y="112" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">0</text><text x="455" y="148" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">1</text><text x="515" y="148" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">0</text><text x="455" y="184" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">2</text><text x="515" y="184" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">0</text><text x="85" y="221" font-size="23" fill="#80500b" text-anchor="middle" font-weight="normal">3 × 1</text><text x="275" y="221" font-size="23" fill="#315fa3" text-anchor="middle" font-weight="normal">1 × 2</text><text x="485" y="221" font-size="23" fill="#236e65" text-anchor="middle" font-weight="normal">3 × 2</text><text x="300" y="256" font-size="19" fill="#17333b" text-anchor="middle" font-weight="normal">Every value component × every key component.</text></g></svg>