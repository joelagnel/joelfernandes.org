<svg xmlns="http://www.w3.org/2000/svg" width="600" height="272" viewBox="0 0 600 272" role="img" aria-labelledby="title desc"><title id="title">Read: a memory matrix times a query</title><desc id="desc">A 3 by 2 state multiplies a 2 by 1 query to produce a 3 by 1 output. Each output component is the dot product of one state row and the query.</desc><rect width="100%" height="100%" rx="8" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif"><text x="300" y="31" font-size="26" fill="#17333b" text-anchor="middle" font-weight="bold">Read the memory: y = S q</text><text x="125" y="72" font-size="25" fill="#236e65" text-anchor="middle" font-weight="normal">S</text><text x="316" y="72" font-size="25" fill="#315fa3" text-anchor="middle" font-weight="normal">q</text><text x="500" y="72" font-size="25" fill="#80500b" text-anchor="middle" font-weight="normal">y</text><path d="M68 84 H59 V196 H68" fill="none" stroke="#236e65" stroke-width="2.5"/><path d="M181 84 H190 V196 H181" fill="none" stroke="#236e65" stroke-width="2.5"/><text x="94" y="112" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">3</text><text x="155" y="112" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">0</text><text x="94" y="148" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">1</text><text x="155" y="148" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">2</text><text x="94" y="184" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">2</text><text x="155" y="184" font-size="29" fill="#236e65" text-anchor="middle" font-weight="normal">1</text><text x="238" y="148" font-size="31" fill="#17333b" text-anchor="middle" font-weight="normal">×</text><path d="M290 102 H281 V178 H290" fill="none" stroke="#315fa3" stroke-width="2.5"/><path d="M342 102 H351 V178 H342" fill="none" stroke="#315fa3" stroke-width="2.5"/><text x="316" y="130" font-size="29" fill="#315fa3" text-anchor="middle" font-weight="normal">0.6</text><text x="316" y="166" font-size="29" fill="#315fa3" text-anchor="middle" font-weight="normal">0.8</text><text x="410" y="148" font-size="31" fill="#17333b" text-anchor="middle" font-weight="normal">=</text><path d="M474 84 H465 V196 H474" fill="none" stroke="#80500b" stroke-width="2.5"/><path d="M526 84 H535 V196 H526" fill="none" stroke="#80500b" stroke-width="2.5"/><text x="500" y="112" font-size="29" fill="#80500b" text-anchor="middle" font-weight="normal">1.8</text><text x="500" y="148" font-size="29" fill="#80500b" text-anchor="middle" font-weight="normal">2.2</text><text x="500" y="184" font-size="29" fill="#80500b" text-anchor="middle" font-weight="normal">2.0</text><text x="125" y="221" font-size="23" fill="#236e65" text-anchor="middle" font-weight="normal">3 × 2</text><text x="316" y="221" font-size="23" fill="#315fa3" text-anchor="middle" font-weight="normal">2 × 1</text><text x="500" y="221" font-size="23" fill="#80500b" text-anchor="middle" font-weight="normal">3 × 1</text><text x="300" y="256" font-size="19" fill="#17333b" text-anchor="middle" font-weight="normal">S rows: value features. S columns: key features.</text></g></svg>