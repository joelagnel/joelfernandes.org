<svg xmlns="http://www.w3.org/2000/svg" width="600" height="384" viewBox="0 0 600 384" role="img" aria-labelledby="title desc"><title id="title">The gated delta rule in three terms</title><desc id="desc">S new equals alpha S old minus beta times the predicted value alpha S old k times k transpose, plus beta v k transpose. The terms decay memory, remove the old association along the key, and write the new association. Read the updated state with q and carry the state to the next token.</desc><rect width="100%" height="100%" rx="8" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif"><text x="300" y="32" font-size="26" fill="#17333b" text-anchor="middle" font-weight="bold">Gated delta: decay, correct, write</text><text x="300" y="72" font-size="22" fill="#17333b" text-anchor="middle" font-weight="normal">S_new = α S_old − β (α S_old k) kᵀ + β v kᵀ</text><rect x="18" y="96" width="564" height="67" rx="6" fill="#fff7d6"/><text x="44" y="124" font-size="25" fill="#80500b" text-anchor="start" font-weight="normal">α S_old</text><text x="260" y="121" font-size="21" fill="#80500b" text-anchor="start" font-weight="bold">Decay the old memory</text><text x="260" y="148" font-size="18" fill="#17333b" text-anchor="start" font-weight="normal">Scale all previous entries.</text><rect x="18" y="173" width="564" height="67" rx="6" fill="#fceaea"/><text x="44" y="209" font-size="22" fill="#9b3939" text-anchor="start" font-weight="normal">−β (α S_old k) kᵀ</text><text x="260" y="198" font-size="20" fill="#9b3939" text-anchor="start" font-weight="bold">Remove the old association</text><text x="260" y="225" font-size="18" fill="#17333b" text-anchor="start" font-weight="normal">Target this key direction.</text><rect x="18" y="250" width="564" height="67" rx="6" fill="#e1f3f0"/><text x="44" y="287" font-size="25" fill="#236e65" text-anchor="start" font-weight="normal">+β v kᵀ</text><text x="260" y="275" font-size="20" fill="#236e65" text-anchor="start" font-weight="bold">Write the new association</text><text x="260" y="302" font-size="18" fill="#17333b" text-anchor="start" font-weight="normal">Same 3 × 2 state shape.</text><text x="300" y="346" font-size="22" fill="#315fa3" text-anchor="middle" font-weight="normal">Read: y = S_new q  →  3 × 1 output</text><text x="300" y="374" font-size="18" fill="#17333b" text-anchor="middle" font-weight="normal">Carry S_new, not y, to the next token.</text></g></svg>