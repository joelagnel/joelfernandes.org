<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowW" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e7a46"/>
    </marker>
    <marker id="arrowLose" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b8b8b8"/>
    </marker>
    <marker id="arrowN" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Forward: max picks one winner per row</text>

  <!-- winner edge -->
  <line x1="118" y1="82" x2="256" y2="140" stroke="#1e7a46" stroke-width="3" marker-end="url(#arrowW)"/>
  <!-- loser edge -->
  <line x1="118" y1="258" x2="256" y2="200" stroke="#b8b8b8" stroke-width="2" marker-end="url(#arrowLose)" stroke-dasharray="6,4"/>
  <!-- max -> B1 -> L -->
  <line x1="330" y1="170" x2="442" y2="170" stroke="#2c5f8a" stroke-width="2" marker-end="url(#arrowN)"/>
  <line x1="528" y1="170" x2="592" y2="170" stroke="#2c5f8a" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- nodes -->
  <circle cx="90" cy="70" r="30" fill="#e7f6ed" stroke="#1e7a46" stroke-width="3"/>
  <circle cx="90" cy="270" r="30" fill="#f4f4f4" stroke="#b8b8b8" stroke-width="2"/>
  <circle cx="500" cy="170" r="30" fill="#eaf2f8" stroke="#2c5f8a" stroke-width="2"/>
  <circle cx="630" cy="170" r="28" fill="#f2f2f2" stroke="#555" stroke-width="2"/>
  <rect x="245" y="142" width="86" height="56" rx="10" fill="#ffffff" stroke="#1e7a46" stroke-width="2"/>

  <g font-size="15" text-anchor="middle" fill="#1a1a1a">
    <text x="90" y="76" font-weight="bold">A11</text>
    <text x="90" y="276" fill="#8a8a8a">A12</text>
    <text x="500" y="176">B1</text>
    <text x="630" y="176" font-style="italic">L</text>
  </g>
  <text x="288" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e7a46">max</text>

  <g font-size="13">
    <text x="150" y="120" fill="#1e7a46" font-weight="bold">winner</text>
    <text x="150" y="228" fill="#9a9a9a">loser</text>
    <text x="386" y="158" text-anchor="middle" fill="#666">B1 = A11</text>
  </g>

  <text x="360" y="322" text-anchor="middle" font-size="12" fill="#888">Row 1 of a 2x2 matrix, assuming A11 &gt; A12. The value of A12 never reaches L.</text>
</svg>
