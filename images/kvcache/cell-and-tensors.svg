  <text x="440.0" y="424" text-anchor="middle" font-size="11.5" fill="#555" font-weight="normal" >The four left columns are separate std::vectors in llama_kv_cells. The two right columns are slices of the ggml tensors cache_k_l* and cache_v_l*.</text>
