  <text x="58" y="378" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" >The loop over j runs these three tests, in this order:</text>
  <text x="58" y="402" text-anchor="start" font-size="11" fill="#888" font-weight="bold" font-family="Menlo, Consolas, monospace">cells.is_empty(j)</text>
  <text x="272" y="402" text-anchor="start" font-size="11" fill="#555" font-weight="normal" >nothing was ever written here, so there is no key to compare against</text>
  <text x="58" y="424" text-anchor="start" font-size="11" fill="#c0392b" font-weight="bold" font-family="Menlo, Consolas, monospace">!cells.seq_has(j, seq_id)</text>
  <text x="272" y="424" text-anchor="start" font-size="11" fill="#555" font-weight="normal" >this key belongs to another conversation; mixing them would corrupt both</text>
  <text x="58" y="446" text-anchor="start" font-size="11" fill="#b8681c" font-weight="bold" font-family="Menlo, Consolas, monospace">cells.pos_get(j) > p1</text>
  <text x="272" y="446" text-anchor="start" font-size="11" fill="#555" font-weight="normal" >this key is from a later position, and a token may not attend to its own future</text>
  <text x="440.0" y="506" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" >pos exists to answer the third question and seq exists to answer the second. Remove either and this row cannot be built.</text>
