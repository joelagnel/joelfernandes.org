<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/>
    </marker>
    <marker id="arPurple" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b4c9a"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>
  <text x="440.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">The life of one cell, and the only two ways it comes back</text>
  <rect x="40" y="104" width="150" height="76" rx="6" fill="#f7f7f7" fill-opacity="1.0" stroke="#888" stroke-width="1.6"/>
  <text x="115.0" y="130" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold" >free</text>
  <text x="115.0" y="150" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">pos = -1</text>
  <text x="115.0" y="166" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">seq = {}</text>
  <rect x="250" y="104" width="150" height="76" rx="6" fill="#eef4fa" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
  <text x="325.0" y="130" text-anchor="middle" font-size="12.5" fill="#2c5f8a" font-weight="bold" >written</text>
  <text x="325.0" y="150" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">pos = 12</text>
  <text x="325.0" y="166" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">seq = {A}</text>
  <rect x="460" y="104" width="150" height="76" rx="6" fill="#f2eefa" fill-opacity="1.0" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="535.0" y="130" text-anchor="middle" font-size="12.5" fill="#6b4c9a" font-weight="bold" >shared</text>
  <text x="535.0" y="150" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">pos = 12</text>
  <text x="535.0" y="166" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">seq = {A,B}</text>
  <rect x="670" y="104" width="150" height="76" rx="6" fill="#f7f7f7" fill-opacity="1.0" stroke="#888" stroke-width="1.6"/>
  <text x="745.0" y="130" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold" >free again</text>
  <text x="745.0" y="150" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">pos = -1</text>
  <text x="745.0" y="166" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" font-family="Menlo, Consolas, monospace">seq = {}</text>
  <line x1="198" y1="142.0" x2="242" y2="142.0" stroke="#2c5f8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="220.0" y="82" text-anchor="middle" font-size="10" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">find_slot()</text>
  <text x="220.0" y="96" text-anchor="middle" font-size="10" fill="#2c5f8a" font-weight="normal" font-family="Menlo, Consolas, monospace">then pos_set()</text>
  <line x1="408" y1="142.0" x2="452" y2="142.0" stroke="#6b4c9a" stroke-width="1.6" marker-end="url(#arPurple)"/>
  <text x="430.0" y="82" text-anchor="middle" font-size="10" fill="#6b4c9a" font-weight="bold" font-family="Menlo, Consolas, monospace">seq_cp(A, B)</text>
  <text x="430.0" y="96" text-anchor="middle" font-size="10" fill="#6b4c9a" font-weight="normal" font-family="Menlo, Consolas, monospace">one more bit</text>
  <line x1="618" y1="142.0" x2="662" y2="142.0" stroke="#2e7d52" stroke-width="1.6" marker-end="url(#arGreen)"/>
  <text x="640.0" y="82" text-anchor="middle" font-size="10" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">seq_rm(B),</text>
  <text x="640.0" y="96" text-anchor="middle" font-size="10" fill="#2e7d52" font-weight="normal" font-family="Menlo, Consolas, monospace">then seq_rm(A)</text>
  <rect x="60" y="226" width="760" height="76" rx="5" fill="#fbfcfd" fill-opacity="1.0" stroke="#888" stroke-width="1.2"/>
  <text x="80" y="250" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" >Dropping chat B does not free the cell:</text>
  <text x="80" y="270" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" >seq[i].reset(B) clears one bit. The cell empties only when seq[i].none() is true, which is the whole</text>
  <text x="80" y="288" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" >reclamation rule. There is no reference count, no timestamp, and no eviction score anywhere in it.</text>
  <text x="440.0" y="332" text-anchor="middle" font-size="11.5" fill="#555" font-weight="normal" >The second route back to free is the sliding-window test inside find_slot(), which reuses a cell whose position</text>
  <text x="440.0" y="350" text-anchor="middle" font-size="11.5" fill="#555" font-weight="normal" >has fallen out of its sequence's window. Those are the only two.</text>
</svg>
