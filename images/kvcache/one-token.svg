<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c5f8a"/>
    </marker>
    <marker id="arGrey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arGreen" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d52"/>
    </marker>
    <marker id="arPurple" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b4c9a"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="440.0" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">One token writes one row into every layer, at the same index</text>
  <rect x="28" y="84" width="132" height="54" rx="5" fill="#f2f6fa" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.6"/>
  <text x="94" y="106" text-anchor="middle" font-size="14" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">"sat"</text>
  <text x="94" y="126" text-anchor="middle" font-size="10.5" fill="#666" font-weight="normal" >position 7, chat A</text>
  <line x1="166" y1="111" x2="202" y2="111" stroke="#2c5f8a" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="184" y="100" text-anchor="middle" font-size="9.5" fill="#777" font-weight="normal" >forward</text>
  <text x="28" y="176" text-anchor="start" font-size="11" fill="#666" font-weight="normal" >The model computes a K</text>
  <text x="28" y="192" text-anchor="start" font-size="11" fill="#666" font-weight="normal" >vector and a V vector for</text>
  <text x="28" y="208" text-anchor="start" font-size="11" fill="#666" font-weight="normal" >this token in each of its</text>
  <text x="28" y="224" text-anchor="start" font-size="11" fill="#666" font-weight="normal" >36 layers.</text>
  <rect x="216" y="62" width="300" height="40" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#888" stroke-width="1.2"/>
  <text x="258" y="86" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" font-family="Menlo, Consolas, monospace">layer 0</text>
  <rect x="302" y="70" width="98" height="24" rx="3" fill="#eef4fa" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="351" y="86" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">K row 7</text>
  <rect x="408" y="70" width="98" height="24" rx="3" fill="#eef7f1" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.2"/>
  <text x="457" y="86" text-anchor="middle" font-size="10.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">V row 7</text>
  <rect x="216" y="110" width="300" height="40" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#888" stroke-width="1.2"/>
  <text x="258" y="134" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" font-family="Menlo, Consolas, monospace">layer 1</text>
  <rect x="302" y="118" width="98" height="24" rx="3" fill="#eef4fa" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="351" y="134" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">K row 7</text>
  <rect x="408" y="118" width="98" height="24" rx="3" fill="#eef7f1" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.2"/>
  <text x="457" y="134" text-anchor="middle" font-size="10.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">V row 7</text>
  <rect x="216" y="158" width="300" height="40" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#888" stroke-width="1.2"/>
  <text x="258" y="182" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" font-family="Menlo, Consolas, monospace">layer 2</text>
  <rect x="302" y="166" width="98" height="24" rx="3" fill="#eef4fa" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="351" y="182" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">K row 7</text>
  <rect x="408" y="166" width="98" height="24" rx="3" fill="#eef7f1" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.2"/>
  <text x="457" y="182" text-anchor="middle" font-size="10.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">V row 7</text>
  <text x="366.0" y="220" text-anchor="middle" font-size="18" fill="#aaa" font-weight="normal" >⋮</text>
  <rect x="216" y="232" width="300" height="40" rx="4" fill="#ffffff" fill-opacity="1.0" stroke="#888" stroke-width="1.2"/>
  <text x="258" y="256" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" font-family="Menlo, Consolas, monospace">layer 35</text>
  <rect x="302" y="240" width="98" height="24" rx="3" fill="#eef4fa" fill-opacity="1.0" stroke="#2c5f8a" stroke-width="1.2"/>
  <text x="351" y="256" text-anchor="middle" font-size="10.5" fill="#2c5f8a" font-weight="bold" font-family="Menlo, Consolas, monospace">K row 7</text>
  <rect x="408" y="240" width="98" height="24" rx="3" fill="#eef7f1" fill-opacity="1.0" stroke="#2e7d52" stroke-width="1.2"/>
  <text x="457" y="256" text-anchor="middle" font-size="10.5" fill="#2e7d52" font-weight="bold" font-family="Menlo, Consolas, monospace">V row 7</text>
  <line x1="532" y1="68" x2="532" y2="266" stroke="#6b4c9a" stroke-width="1.6"/>
  <line x1="527" y1="68" x2="537" y2="68" stroke="#6b4c9a" stroke-width="1.6"/>
  <line x1="527" y1="266" x2="537" y2="266" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="544" y="138" text-anchor="start" font-size="12" fill="#6b4c9a" font-weight="bold" font-family="Menlo, Consolas, monospace">row index 7</text>
  <text x="544" y="156" text-anchor="start" font-size="11" fill="#6b4c9a" font-weight="normal" >in all 72 tensors.</text>
  <text x="544" y="174" text-anchor="start" font-size="11" fill="#666" font-weight="normal" >That one shared index</text>
  <text x="544" y="190" text-anchor="start" font-size="11" fill="#666" font-weight="normal" >is what the code calls</text>
  <text x="544" y="208" text-anchor="start" font-size="12" fill="#6b4c9a" font-weight="bold" >a cell.</text>
  <rect x="40" y="352" width="800" height="58" rx="5" fill="#fbfcfd" fill-opacity="1.0" stroke="#888" stroke-width="1.2"/>
  <text x="56" y="374" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" >Qwen3-4B, f16 cache:</text>
  <text x="56" y="394" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" font-family="Menlo, Consolas, monospace">1024 values per row  ×  2 bytes  ×  2 rows (K and V)  ×  36 layers  =  147,456 bytes  =  144 KiB for this one token</text>
</svg>
