<text x="125.00" y="621" text-anchor="middle" class="small">-4</text>
<line x1="346.25" y1="120" x2="346.25" y2="590" class="grid"/>
<text x="346.25" y="621" text-anchor="middle" class="small">-2</text>
<line x1="567.50" y1="120" x2="567.50" y2="590" class="grid"/>
<text x="567.50" y="621" text-anchor="middle" class="small">0</text>
