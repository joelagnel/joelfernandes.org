<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="870" viewBox="0 0 1080 870" role="img" aria-labelledby="title desc">
  <title id="title">GELU, SwiGLU, and ReLU training and validation loss curves</title>
  <desc id="desc">One shared-axis chart shows the recorded fixed training-prefix and held-out validation cross-entropy losses of GELU, SwiGLU, and ReLU build-nanoGPT runs as processed training tokens increase. Each activation has a colored solid validation curve and a matching dashed training curve. A vertical dashed line at 176.2 million tokens marks the shared comparison point. Open circles show interpolated GELU and ReLU validation values and a filled circle shows the measured SwiGLU value.</desc>
  <style>
    .title { font: 700 40px Arial, sans-serif; fill: #20252b; }
    .subtitle { font: 24px Arial, sans-serif; fill: #4b5563; }
    .label { font: 28px Arial, sans-serif; fill: #20252b; }
    .small { font: 24px Arial, sans-serif; fill: #4b5563; }
    .axis { stroke: #3b4550; stroke-width: 2; }
    .grid { stroke: #d8dee5; stroke-width: 1; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="540" y="48" text-anchor="middle" class="title">Loss decay in three build-nanoGPT runs</text>
<text x="540" y="80" text-anchor="middle" class="subtitle">Solid: fixed held-out validation loss. Dashed: fixed training-prefix loss. Initialization is omitted.</text>
